schema_version: "3"

capabilities:
  - id: hermes-pm
    version: "1.0.0"
    labels: [planner, product]
    adapter:
      type: hermes.acp
      config:
        command: [hermes, acp]

  - id: hermes-project-admin
    version: "1.0.0"
    labels: [planner, tasking]
    adapter:
      type: hermes.acp
      config:
        command: [hermes, acp]

  - id: codex-backend
    version: "1.0.0"
    labels: [developer, backend]
    adapter:
      type: codex.cli
      config:
        command: [codex]
        timeout_seconds: 180
        sandbox: workspace-write

  - id: http-planner
    version: "1.0.0"
    labels: [planner]
    adapter:
      type: http.sync
      config:
        endpoint: http://127.0.0.1:9000/v1/invoke
        timeout_seconds: 120
        bearer_token_env: HTTP_AGENT_TOKEN

  - id: hermes-developer
    version: "1.0.0"
    labels: [developer, coding]
    adapter:
      type: hermes.acp
      config:
        command: [hermes, acp]
        env:
          HERMES_API_KEY: HERMES_API_KEY
    policy:
      workspace_edits: allow
      command_allowlist: [uv run pytest]
