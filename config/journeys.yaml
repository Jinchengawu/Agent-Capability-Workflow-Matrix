schema_version: "3"

journeys:
  - id: mixed-code-delivery
    version: "2.0.0"
    steps:
      - kind: stage
        id: plan
        workflow_mode: direct
        bindings: {actor: http-planner}
      - kind: approval_gate
        id: approve-plan
        subject_kind: implementation-plan
      - kind: stage
        id: deliver
        workflow_mode: langgraph.code-delivery
        bindings: {developer: hermes-developer}
