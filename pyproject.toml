[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-capability-workflow-matrix"
version = "0.4.0"
description = "A capability-portable, workflow-polymorphic runtime for long-horizon agent journeys."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Jinchengawu" }]
dependencies = [
  "pydantic>=2.12,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.22,<0.23"]
http = ["httpx>=0.28,<0.29"]
agentscope = ["agentscope==2.0.6"]
langgraph = [
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-sqlite>=3.1,<3.2",
]
acp = ["agent-client-protocol==0.9.0"]
server = [
  "aiosqlite>=0.22,<0.23",
  "agent-client-protocol==0.9.0",
  "fastapi>=0.133,<0.134",
  "httpx>=0.28,<0.29",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-sqlite>=3.1,<3.2",
  "sse-starlette>=3.3,<4",
  "uvicorn[standard]>=0.41,<0.42",
]
dev = [
  "aiosqlite>=0.22,<0.23",
  "agent-client-protocol==0.9.0",
  "agentscope==2.0.6",
  "fastapi>=0.133,<0.134",
  "httpx>=0.28,<0.29",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-sqlite>=3.1,<3.2",
  "mypy>=1.19,<2",
  "numpy>=2,<2.4",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<0.16",
  "sse-starlette>=3.3,<4",
  "types-pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.41,<0.42",
]

[project.scripts]
acwm = "acwm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acwm"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: opt-in tests requiring local services or credentials"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["acwm"]
